<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — ReLoop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container-narrow">
  <h1>Create your account</h1>
  <div class="panel">
    <form id="regForm">
      <div class="form-row"><label>Name</label><input type="text" id="name" required></div>
      <div class="form-row"><label>Email</label><input type="email" id="email" required></div>
      <div class="form-row"><label>Password</label><input type="password" id="password" required minlength="6"></div>
      <button class="btn btn-primary" type="submit">Sign up</button>
    </form>
    <p class="meta" style="margin-top:14px">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => { await initPage(); if (CURRENT_USER) location.href = 'index.html'; })();
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })});
    location.href = 'index.html';
  } catch (err) { toast(err.message); }
});
</script>
</body>
</html>
