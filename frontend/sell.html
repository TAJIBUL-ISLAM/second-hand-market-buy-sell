<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell an item — ReLoop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container-narrow">
  <h1>List an item for sale</h1>
  <div class="panel">
    <form id="sellForm">
      <div class="form-row"><label>Title</label><input type="text" id="title" required></div>
      <div class="form-row"><label>Description</label><textarea id="description" placeholder="Condition details, reason for selling, any flaws…"></textarea></div>
      <div class="two-col">
        <div class="form-row"><label>Category</label><select id="category"></select></div>
        <div class="form-row"><label>Condition</label><select id="condition"></select></div>
      </div>
      <div class="two-col">
        <div class="form-row"><label>Price (₹)</label><input type="number" id="price" required></div>
        <div class="form-row"><label>Location</label><input type="text" id="location" placeholder="e.g. Guwahati"></div>
      </div>
      <div class="form-row"><label>Photo</label><input type="file" id="photo" accept="image/*"></div>
      <button class="btn btn-primary" type="submit">Publish listing</button>
    </form>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  await initPage();
  if (!requireLogin()) return;
  CATEGORIES.forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c[0].toUpperCase()+c.slice(1);
    document.getElementById('category').appendChild(o);
  });
  CONDITIONS.forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c[0].toUpperCase()+c.slice(1);
    document.getElementById('condition').appendChild(o);
  });
})();

document.getElementById('sellForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData();
  fd.append('title', document.getElementById('title').value);
  fd.append('description', document.getElementById('description').value);
  fd.append('category', document.getElementById('category').value);
  fd.append('condition_grade', document.getElementById('condition').value);
  fd.append('price', document.getElementById('price').value);
  fd.append('location', document.getElementById('location').value);
  const photoFile = document.getElementById('photo').files[0];
  if (photoFile) fd.append('photo', photoFile);

  try {
    const listing = await apiFetch('/listings', { method: 'POST', body: fd });
    toast('Listing published!');
    setTimeout(() => location.href = 'listing.html?id=' + listing.id, 700);
  } catch (err) { toast(err.message); }
});
</script>
</body>
</html>
